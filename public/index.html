<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Demo — Chat App</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 720px; margin: 0 auto; background: white; border: 1px solid #dce3ee; border-radius: 18px; padding: 24px; box-shadow: 0 12px 35px #15284b12; }
    h1 { margin: 0 0 6px; } .muted { color: #667085; }
    .status { display: inline-flex; gap: 8px; align-items: center; padding: 7px 11px; border-radius: 99px; background: #e8f8ef; color: #17683a; font-size: 13px; }
    form { display: flex; gap: 10px; margin: 22px 0; }
    input { min-width: 0; flex: 1; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; font: inherit; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #2457d6; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #1946b9; }
    #messages { list-style: none; padding: 0; display: grid; gap: 10px; }
    #messages li { background: #eef3ff; padding: 12px 14px; border-radius: 12px; overflow-wrap: anywhere; }
    #feedback { min-height: 24px; color: #a32929; }
    .note { border-top: 1px solid #e5eaf2; margin-top: 22px; padding-top: 14px; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <span class="status"><span aria-hidden="true">●</span> Chat App demo</span>
  <h1>DevOps Chat App</h1>
  <p class="muted">Send a message, then follow how code is tested, packaged and deployed.</p>
  <form id="message-form">
    <input id="message-input" maxlength="280" placeholder="Type a message…" aria-label="Message" required>
    <button type="submit">Send</button>
  </form>
  <p id="feedback" role="status"></p>
  <h2>Messages</h2>
  <ul id="messages"><li class="muted">Loading messages…</li></ul>
  <p class="note muted">Demo note: messages are stored in memory and reset when the server restarts. This is not a production chat service.</p>
</main>
<script>
  const list = document.querySelector("#messages");
  const form = document.querySelector("#message-form");
  const input = document.querySelector("#message-input");
  const feedback = document.querySelector("#feedback");

  async function loadMessages() {
    const response = await fetch("/api/messages");
    const data = await response.json();
    list.replaceChildren();
    if (!data.messages.length) {
      const item = document.createElement("li");
      item.className = "muted";
      item.textContent = "No messages yet. Send the first one!";
      list.append(item);
      return;
    }
    for (const message of data.messages) {
      const item = document.createElement("li");
      item.textContent = message.text;
      list.append(item);
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    feedback.textContent = "";
    const response = await fetch("/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: input.value })
    });
    const data = await response.json();
    if (!response.ok) {
      feedback.textContent = data.error || "Could not send message.";
      return;
    }
    input.value = "";
    await loadMessages();
  });

  loadMessages().catch(() => {
    list.textContent = "Could not connect to the server. Check the application logs.";
  });
</script>
</body>
</html>
