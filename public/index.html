<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat App — Join</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #075e54;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 60px rgba(0,0,0,.25);
      text-align: center;
    }

    .logo {
      width: 72px; height: 72px;
      background: #25d366;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 20px rgba(37,211,102,.35);
    }
    .logo svg { width: 40px; height: 40px; fill: #fff; }

    h1 {
      font-size: 1.5rem;
      color: #111;
      margin-bottom: 6px;
    }
    .sub {
      font-size: .9rem;
      color: #888;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      text-align: left;
      font-size: .82rem;
      font-weight: 700;
      color: #555;
      margin-bottom: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-size: 1rem;
      color: #111;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #25d366; }
    input::placeholder { color: #bbb; }

    button {
      width: 100%;
      background: #25d366;
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      box-shadow: 0 4px 14px rgba(37,211,102,.35);
    }
    button:hover { background: #1ebe5a; }
    button:disabled { background: #a8e6bf; box-shadow: none; cursor: not-allowed; }

    .error {
      font-size: .82rem;
      color: #e53e3e;
      margin-top: -10px;
      margin-bottom: 12px;
      text-align: left;
      min-height: 18px;
    }

    .footer {
      margin-top: 24px;
      font-size: .75rem;
      color: #bbb;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
    </div>
    <h1>Chat App</h1>
    <p class="sub">Enter your name to join the chat room.<br>Open in another tab to chat with yourself!</p>

    <form id="join-form">
      <label for="name-input">Your name</label>
      <input id="name-input" type="text" maxlength="30" placeholder="e.g. Praveen" autocomplete="off" autofocus>
      <div class="error" id="error"></div>
      <button type="submit" id="join-btn">Join Chat →</button>
    </form>

    <div class="footer">DevOps Demo · CS25C10 · Node.js + Express + Docker</div>
  </div>

  <script>
    const form = document.getElementById("join-form");
    const nameInput = document.getElementById("name-input");
    const errorEl = document.getElementById("error");
    const joinBtn = document.getElementById("join-btn");

    // if already joined, go straight to chat
    if (sessionStorage.getItem("chat_name")) {
      window.location.replace("chat.html");
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) {
        errorEl.textContent = "Please enter your name.";
        nameInput.focus();
        return;
      }
      errorEl.textContent = "";
      joinBtn.disabled = true;
      sessionStorage.setItem("chat_name", name);
      window.location.href = "chat.html";
    });

    nameInput.addEventListener("input", () => { errorEl.textContent = ""; });
  </script>
</body>
</html>
