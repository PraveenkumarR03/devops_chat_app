name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:

  # ── STEP 1 · CODE ───────────────────────────────────────────────────────────
  # Triggered automatically when code is pushed to GitHub (Version Control)
  code:
    name: "Step 1 · Code — Checkout & Verify"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v4

      - name: Show commit info
        run: |
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo "Author : ${{ github.actor }}"

  # ── STEP 2 · BUILD ──────────────────────────────────────────────────────────
  # Install dependencies and verify the app compiles / starts
  build:
    name: "Step 2 · Build — Install Dependencies"
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

  # ── STEP 3 · TEST ───────────────────────────────────────────────────────────
  # Run automated tests — pipeline stops here if any test fails
  test:
    name: "Step 3 · Test — Run Automated Tests"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

  # ── STEP 4 · PACKAGE ────────────────────────────────────────────────────────
  # Build Docker image and push to Docker Hub (artifact repository)
  # Only runs on push to main — not on pull requests
  package:
    name: "Step 4 · Package — Build & Push Docker Image"
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops_chat_app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops_chat_app:latest

  # ── STEP 5 · DEPLOY ─────────────────────────────────────────────────────────
  # Trigger Render to pull the new Docker image and go live
  deploy:
    name: "Step 5 · Deploy — Push to Production (Render)"
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/devops_chat_app:${IMAGE_TAG}"

          ENCODED_IMAGE=$(python3 -c \
            "from urllib.parse import quote; print(quote('${IMAGE}', safe=''))")

          curl --fail --silent --show-error \
            --request POST \
            "${RENDER_HOOK}&imgURL=${ENCODED_IMAGE}"

  # ── STEP 6 · RELEASE ────────────────────────────────────────────────────────
  # Create a versioned GitHub Release after successful deployment
  release:
    name: "Step 6 · Release — Create GitHub Release Tag"
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          body: |
            Deployed automatically from commit ${{ github.sha }}

            **Docker image:** `${{ secrets.DOCKERHUB_USERNAME }}/devops_chat_app:${{ github.sha }}`
          generate_release_notes: true
