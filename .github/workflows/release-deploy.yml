name: Release and Deploy Chat App

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ── 1. Run tests ────────────────────────────────────────────────────────────
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # ── 2. Build Docker image and push to Docker Hub ────────────────────────────
  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-app-devops-demo:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-app-devops-demo:latest

  # ── 3. Trigger Render deployment ────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/chat-app-devops-demo:${RELEASE_TAG}"

          ENCODED_IMAGE=$(python3 -c \
            "from urllib.parse import quote; print(quote('${IMAGE}', safe=''))")

          curl --fail --silent --show-error \
            --request POST \
            "${RENDER_HOOK}&imgURL=${ENCODED_IMAGE}"
